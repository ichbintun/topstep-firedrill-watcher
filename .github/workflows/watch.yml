name: Topstep Fire Drill Watcher

on:
  schedule:
    # Moi 10 phut, 13:00-22:59 UTC, Thu 2 - Thu 6
    # = 20:00 - 05:59 gio Viet Nam (trung gio TopstepTV phat song)
    - cron: '*/10 13-22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firedrill-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kiem tra trang fire drill
        env:
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO:             ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Luu trang thai
        run: |
          git config user.name  "firedrill-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # State vua tinh xong luon la cai dung -> dong bo ve origin roi dat de len,
          # khong bao gio phai merge, khong bao gio conflict.
          for attempt in 1 2 3; do
            cp state.json /tmp/state.json
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/state.json state.json

            if [[ -z "$(git status --porcelain state.json)" ]]; then
              echo "state.json khong doi"
              exit 0
            fi

            git add state.json
            git commit -qm "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "da luu state.json (lan thu $attempt)"
              exit 0
            fi
            echo "push that bai, origin vua doi - thu lai..."
            sleep 3
          done
          echo "::warning::Khong push duoc state.json sau 3 lan"
